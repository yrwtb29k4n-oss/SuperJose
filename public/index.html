<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Super José Supermercado — Terminal Pix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens — fundo branco, azul royal como unico acento, Inter.
     ===================================================================== */
  :root{
    --bg:        #FFFFFF;
    --bg-elev:   #FFFFFF;
    --panel:     #F7F8FA;
    --panel-2:   #F0F2F5;
    --line:      #E5E7EB;
    --line-soft: #EDEEF1;
    --ink:       #0B0E14;
    --ink-dim:   #6B7280;
    --ink-faint: #9CA3AF;

    --blue:      #2A4CFF;
    --blue-ink:  #FFFFFF;
    --blue-dim:  rgba(42,76,255,0.08);
    --blue-line: rgba(42,76,255,0.28);

    --danger:    #DC2626;
    --danger-dim:rgba(220,38,38,0.08);

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .mono{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum'; }
  ::selection{ background:var(--blue-dim); }

  input{ font-family:inherit; color:inherit; }
  input:focus{ outline:none; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- Barra superior ---------- */
  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:var(--bg-elev);
  }
  .marca{ display:flex; align-items:center; gap:10px; }
  .marca-icone{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    color:var(--blue);
    flex-shrink:0;
  }
  .marca-icone img{ width:100%; height:100%; object-fit:contain; }
  .marca-texto{
    font-size:13px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .marca-texto small{
    display:block;
    font-size:10.5px;
    font-weight:500;
    color:var(--ink-faint);
    letter-spacing:0.02em;
  }
  .trilha{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.06em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }

  /* ---------- Palco ---------- */
  .palco{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-y:auto;
    min-height:0;
  }
  .tela{ width:100%; max-width:440px; }
  .tela.hidden{ display:none; }

  .rotulo{
    font-size:11px;
    font-weight:600;
    color:var(--blue);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:10px;
  }
  .rotulo.amb{ color:var(--ink-faint); }
  h1{
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin-bottom:20px;
    color:var(--ink);
  }
  h1:has(+ .sub){ margin-bottom:6px; }
  .sub{
    font-size:13px;
    color:var(--ink-dim);
    line-height:1.5;
    margin-bottom:20px;
  }

  /* ---------- Tecla: indicador de atalho, plano e minimalista ---------- */
  .tecla{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:24px;
    height:24px;
    padding:0 7px;
    border-radius:6px;
    background:var(--panel);
    border:1px solid var(--line);
    font-weight:600;
    font-size:12px;
    color:var(--ink-dim);
    flex-shrink:0;
    transition:opacity .04s ease;
  }
  .tecla.grande{ min-width:30px; height:30px; font-size:13px; border-radius:7px; }
  .tecla.ir{
    background:var(--blue);
    border-color:var(--blue);
    color:var(--blue-ink);
  }
  .tecla.pressed{ opacity:.6; }

  /* ---------- Opcao ---------- */
  .opcoes{ display:flex; flex-direction:column; gap:8px; }
  .opcao{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 16px;
    border:1px solid var(--line);
    border-radius:var(--r-md);
    background:var(--bg);
    color:var(--ink);
    text-align:left;
    transition:border-color .1s ease;
  }
  .opcao:active{ background:var(--panel); }
  .opcao .icone{
    width:26px; height:26px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint);
  }
  .opcao .icone svg{ width:100%; height:100%; }
  .opcao .texto{ flex:1; min-width:0; }
  .opcao .titulo{ font-size:14px; font-weight:500; }
  .opcao .desc{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .opcao .tag{ font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px; }
  .opcao .tag.ok{ color:var(--blue); background:var(--blue-dim); }
  .opcao .tag.off{ color:var(--danger); background:var(--danger-dim); }

  /* ---------- Painel de entrada inicial ---------- */
  .grade-inicio{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .grade-inicio{ grid-template-columns:1fr; } }
  .bloco-inicio{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
    padding:26px 16px;
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    background:var(--bg);
    color:var(--ink);
    min-height:170px;
    justify-content:center;
  }
  .bloco-inicio .icone{ width:28px; height:28px; color:var(--ink-faint); }
  .bloco-inicio .icone svg{ width:100%; height:100%; }
  .bloco-inicio .titulo{ font-size:14px; font-weight:600; }
  .bloco-inicio .desc{ font-size:11.5px; color:var(--ink-faint); line-height:1.4; }
  .bloco-inicio.admin .icone{ color:var(--ink-faint); }

  /* ---------- Entrada numerica ---------- */
  .visor{
    border:1px solid var(--line);
    border-radius:var(--r-md);
    background:var(--panel);
    padding:18px;
    margin-bottom:14px;
  }
  .visor input{
    width:100%;
    border:none;
    background:transparent;
    font-size:32px;
    font-weight:600;
    letter-spacing:0.01em;
    text-align:center;
    color:var(--ink);
  }
  .visor input::placeholder{ color:var(--ink-faint); }
  .visor input.senha-dots{ letter-spacing:0.3em; }

  .dica{ font-size:12px; color:var(--ink-faint); text-align:center; margin-bottom:18px; }
  .erro-box{
    display:none;
    font-size:13px;
    color:var(--danger);
    background:var(--danger-dim);
    border:1px solid rgba(220,38,38,0.2);
    border-radius:var(--r-sm);
    padding:10px 12px;
    margin-bottom:16px;
  }
  .ok-box{
    display:none;
    font-size:13px;
    color:var(--blue);
    background:var(--blue-dim);
    border:1px solid var(--blue-line);
    border-radius:var(--r-sm);
    padding:10px 12px;
    margin-bottom:16px;
  }

  /* ---------- Etiqueta do caixa logado ---------- */
  .etiqueta{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:11.5px;
    font-weight:600;
    color:var(--blue);
    background:var(--blue-dim);
    padding:5px 10px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .etiqueta .ponto{ width:6px; height:6px; border-radius:50%; background:var(--blue); }

  /* ---------- QR ---------- */
  .qr-area{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .qr-caixa{
    width:min(340px, 82vw);
    height:min(340px, 82vw);
    border-radius:var(--r-md);
    background:#fff;
    border:1px solid var(--line);
    padding:14px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px;
  }
  .qr-caixa img{ width:100%; height:100%; object-fit:contain; }
  .status-espera{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px; font-weight:500; color:var(--ink-dim);
    margin-bottom:6px;
  }
  .status-espera .ponto{
    width:6px; height:6px; border-radius:50%; background:var(--blue);
    animation:piscar 1.3s ease-in-out infinite;
  }
  @keyframes piscar{ 0%,100%{opacity:1;} 50%{opacity:.2;} }
  .valor-grande{ font-size:28px; font-weight:600; margin:10px 0 6px; }
  .qr-instrucao{ font-size:12px; color:var(--ink-faint); max-width:280px; line-height:1.5; }

  /* ---------- Confirmado ---------- */
  .marca-check{
    width:52px; height:52px; border-radius:50%;
    background:var(--blue-dim);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 16px;
    color:var(--blue);
  }
  .marca-check svg{ width:24px; height:24px; }
  .titulo-central{ text-align:center; font-size:17px; font-weight:600; margin-bottom:4px; }
  .sub-central{ text-align:center; font-size:12.5px; color:var(--ink-dim); margin-bottom:20px; }

  .recibo{
    border:1px solid var(--line);
    border-radius:var(--r-md);
    background:var(--panel);
    padding:6px 16px;
    margin-bottom:20px;
  }
  .recibo-linha{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:13px;
  }
  .recibo-linha:last-child{ border-bottom:none; }
  .recibo-linha span:first-child{ color:var(--ink-dim); }
  .recibo-linha span:last-child{ font-weight:600; }

  /* ---------- Listas navegaveis ---------- */
  .lista{
    border:1px solid var(--line);
    border-radius:var(--r-md);
    overflow:hidden;
    margin-bottom:6px;
  }
  .item-lista{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-bottom:1px solid var(--line-soft);
    background:var(--bg);
  }
  .item-lista:last-child{ border-bottom:none; }
  .item-lista.ativo{
    background:var(--blue-dim);
    box-shadow:inset 3px 0 0 var(--blue);
  }
  .item-lista .num{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-faint);
    width:16px;
    text-align:center;
    flex-shrink:0;
  }
  .item-lista.ativo .num{ color:var(--blue); }
  .item-lista .info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .item-lista .principal{ font-size:13.5px; font-weight:500; }
  .item-lista .secundario{ font-size:11.5px; color:var(--ink-dim); }
  .item-lista .destaque{ font-weight:600; font-size:13.5px; }
  .vazio{ font-size:13px; color:var(--ink-faint); padding:22px 14px; text-align:center; }
  .tag-status{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
  .tag-status.aprovado{ color:var(--blue); }
  .tag-status.pendente{ color:var(--ink-dim); }
  .tag-status.cancelado, .tag-status.expirado{ color:var(--ink-faint); }

  .dica-navegacao{ display:none; }

  /* ---------- Rodape: teclas ativas ---------- */
  .rodape{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    padding:13px 20px;
    border-top:1px solid var(--line);
    background:var(--bg-elev);
  }
  .dica-tecla{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-dim); }

  .hidden{ display:none !important; }

  /* =====================================================================
     Area de impressao — invisivel na tela, so existe pro cupom termico.
     ===================================================================== */
  #area-impressao{ display:none; }
  @media print {
    body > *:not(#area-impressao){ display:none !
